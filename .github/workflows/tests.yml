name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install integration test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-utils zstd rclone
      - name: Run lifecycle and real transport/snapshot tests
        run: python3 -m unittest discover -s tests -v
      - name: Check command help
        run: |
          python3 pve_drive.py --help
          python3 pve_drive.py upload --help
          python3 pve_drive.py restore --help
      - name: Check installer on Linux
        run: |
          sh -n install.sh
          sudo ./install.sh
          /usr/local/sbin/pve-drive --version
          sudo ./install.sh
